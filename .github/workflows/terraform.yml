name: terraform

on:
  workflow_call:
    inputs:
      working-directory:
        description: Diretório do código Terraform, relativo à raiz do repositório.
        type: string
        default: infra
      state-bucket:
        description: Bucket S3 do state (variável TF_STATE_BUCKET).
        type: string
        required: true
      state-key:
        description: Chave do state no bucket, no formato <repo>/prod.tfstate.
        type: string
        required: true
      aws-region:
        description: Região AWS.
        type: string
        default: us-east-1
      plan-role-arn:
        description: Role assumida em pull requests (variável AWS_ROLE_ARN_PLAN).
        type: string
        required: true
      deploy-role-arn:
        description: Role assumida no push da main (variável AWS_ROLE_ARN_DEPLOY).
        type: string
        required: true
      artifact-name:
        description: Artefato baixado antes do plan, por exemplo o pacote da Lambda. Vazio para nenhum.
        type: string
        default: ""
      artifact-path:
        description: Pasta, relativa à raiz do repositório, onde o artefato é extraído.
        type: string
        default: dist
      terraform-version:
        description: Versão do Terraform.
        type: string
        default: 1.16.6
      tflint-version:
        description: Versão do tflint.
        type: string
        default: v0.64.0

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - if: inputs.artifact-name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ inputs.plan-role-arn }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337
        with:
          tflint_version: ${{ inputs.tflint-version }}

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ inputs.state-bucket }}"
          -backend-config="key=${{ inputs.state-key }}"
          -backend-config="region=${{ inputs.aws-region }}"

      - name: validate
        run: terraform validate -no-color

      - name: tflint
        run: |
          config=""
          if [ -f "$GITHUB_WORKSPACE/.tflint.hcl" ]; then config="--config=$GITHUB_WORKSPACE/.tflint.hcl"; fi
          tflint --init $config
          tflint $config

      - name: test
        run: if [ -d tests ]; then terraform test -no-color; fi

      - name: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan | tee plan.txt

      - name: comentar plan no PR
        if: always() && hashFiles(format('{0}/plan.txt', inputs.working-directory)) != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PLAN_FILE: ${{ inputs.working-directory }}/plan.txt
          MARKER: "<!-- terraform-plan:${{ inputs.working-directory }} -->"
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const plan = raw.length > 60000 ? raw.slice(-60000) : raw;
            const summary = (raw.match(/^(Plan:.*|No changes\..*)$/m) || ['sem resumo'])[0];
            const body = `${process.env.MARKER}\n### Terraform plan · \`${process.env.PLAN_FILE.replace('/plan.txt', '')}\`\n**${summary}**\n<details><summary>Saída completa</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.body.includes(process.env.MARKER));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-apply-${{ github.repository }}-${{ inputs.working-directory }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - if: inputs.artifact-name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ inputs.deploy-role-arn }}
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: init
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ inputs.state-bucket }}"
          -backend-config="key=${{ inputs.state-key }}"
          -backend-config="region=${{ inputs.aws-region }}"

      - name: plan
        run: terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan

      - name: apply
        run: terraform apply -input=false -no-color -lock-timeout=120s tfplan
