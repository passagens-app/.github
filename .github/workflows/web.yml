name: web

on:
  workflow_call:
    inputs:
      node-version:
        description: Versão do Node.js.
        type: string
        default: "22"
      aws-region:
        description: Região AWS.
        type: string
        default: us-east-1
      deploy-role-arn:
        description: Role assumida no push da main (variável AWS_ROLE_ARN_DEPLOY).
        type: string
        required: true
      bucket-parameter:
        description: Parâmetro SSM com o nome do bucket do site.
        type: string
        default: /passagens/platform/web/bucket-name
      distribution-parameter:
        description: Parâmetro SSM com o ID da distribuição do CloudFront.
        type: string
        default: /passagens/platform/web/distribution-id

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: web-deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-dist
          path: dist

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ inputs.deploy-role-arn }}
          role-session-name: gha-web-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: publicar no S3 e invalidar o CloudFront
        run: |
          bucket=$(aws ssm get-parameter --name "${{ inputs.bucket-parameter }}" --query Parameter.Value --output text)
          distribution=$(aws ssm get-parameter --name "${{ inputs.distribution-parameter }}" --query Parameter.Value --output text)
          aws s3 sync dist "s3://$bucket" --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$bucket/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths "/index.html" "/"
